<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка — Виктория</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #f8f7f2);
            color: var(--tg-theme-text-color, #303a3d);
            margin: 0;
            padding: 16px;
        }
        h2 { font-size: 20px; margin-bottom: 16px; color: #496b78; }
        .product-card {
            background: #fff;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .product-title { font-weight: 600; font-size: 16px; }
        .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        input[type="number"] {
            width: 90px;
            padding: 6px;
            border: 1px solid #dce2df;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            background: #496b78;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        button:hover { background: #354f59; }
        .toggle-label { font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Управление каталогом</h2>
    <div id="loading">Загрузка товаров...</div>
    <div id="productsList"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const FUNCTION_URL = 'https://aqfxxgcnsjvucxhhagrt.supabase.co/functions/v1/admin-panel'; // Замените на URL вашей функции

        async function loadProducts() {
            try {
                const res = await fetch(FUNCTION_URL);
                const products = await res.json();
                
                const container = document.getElementById('productsList');
                document.getElementById('loading').style.display = 'none';
                container.innerHTML = '';

                products.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <div class="product-title">${p.title}</div>
                        <div class="row">
                            <span>Цена (${p.price_unit || '₽/кг'}):</span>
                            <div>
                                <input type="number" id="price_${p.id}" value="${p.price}">
                                <button onclick="updatePrice(${p.id})">ОК</button>
                            </div>
                        </div>
                        <div class="row">
                            <label class="toggle-label">
                                <input type="checkbox" id="avail_${p.id}" ${p.is_available ? 'checked' : ''} onchange="updateStatus(${p.id}, 'is_available')">
                                В наличии
                            </label>
                            <label class="toggle-label">
                                <input type="checkbox" id="active_${p.id}" ${p.is_active ? 'checked' : ''} onchange="updateStatus(${p.id}, 'is_active')">
                                Показывать на сайте
                            </label>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error(err);
                document.getElementById('loading').textContent = 'Ошибка загрузки данных';
            }
        }

        async function updatePrice(id) {
            const price = parseFloat(document.getElementById(`price_${id}`).value);
            await sendUpdate(id, { price });
        }

        async function updateStatus(id, field) {
            const val = document.getElementById(`${field === 'is_available' ? 'avail' : 'active'}_id` || `${field === 'is_available' ? 'avail' : 'active'}_${id}`).checked;
            const payload = {};
            payload[field] = val;
            await sendUpdate(id, payload);
        }

        async function sendUpdate(id, data) {
            try {
                const res = await fetch(FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, ...data })
                });
                const result = await res.json();
                if (result.success) {
                    tg.HapticFeedback.notificationOccurred('success');
                } else {
                    alert('Ошибка сохранения');
                }
            } catch (err) {
                console.error(err);
                alert('Ошибка сети');
            }
        }

        loadProducts();
    </script>
</body>
</html>
