<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Управление каталогом · Виктория</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f8f7f2);
            --text-color: var(--tg-theme-text-color, #303a3d);
            --card-bg: var(--tg-theme-section-bg-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #707b7d);
            --button-color: var(--tg-theme-button-color, #496b78);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --border-color: #dce2df;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            padding-bottom: 50px;
            -webkit-font-smoothing: antialiased;
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--button-color);
        }

        .subtitle {
            font-size: 13px;
            color: var(--hint-color);
            margin-bottom: 20px;
        }

        #loading {
            text-align: center;
            padding: 40px;
            color: var(--hint-color);
            font-size: 14px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 4px 16px rgba(47, 65, 68, 0.04);
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .product-card.saving {
            opacity: 0.7;
            pointer-events: none;
        }

        .product-title {
            font-weight: 600;
            font-size: 17px;
            letter-spacing: -0.3px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .price-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        input[type="number"] {
            width: 100px;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            background: var(--bg-color);
            color: var(--text-color);
            outline: none;
        }

        input[type="number"]:focus {
            border-color: var(--button-color);
        }

        .btn-save {
            background-color: var(--button-color);
            color: var(--button-text);
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .btn-save:active { opacity: 0.8; }

        .toggles-group {
            display: flex;
            gap: 16px;
            padding-top: 8px;
            border-top: 1px solid rgba(220, 226, 223, 0.5);
        }

        .toggle-label {
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            font-weight: 500;
        }

        .toggle-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--button-color);
            cursor: pointer;
        }

        .status-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            background: #eef2f3;
            color: #556063;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <h2>Управление каталогом</h2>
    <div class="subtitle">Изменения применяются на сайте мгновенно</div>

    <div id="loading">Загрузка товаров из базы...</div>
    <div id="productsList"></div>

    <script>
        // Безопасная инициализация Telegram Web App (работает и в ТГ, и в браузере без ошибок)
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        // Адрес вашей Edge-функции в Supabase
        const FUNCTION_URL = 'https://aqfxxgcnsjvucxhhagrt.supabase.co/functions/v1/admin-panel';

        async function loadProducts() {
            try {
                const res = await fetch(FUNCTION_URL);
                if (!res.ok) throw new Error('Ошибка сети');
                const products = await res.json();
                
                const container = document.getElementById('productsList');
                document.getElementById('loading').style.display = 'none';
                container.innerHTML = '';

                products.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.id = `card_${p.id}`;
                    card.innerHTML = `
                        <div class="row">
                            <span class="product-title">${escapeHtml(p.title)}</span>
                            <span class="status-badge" id="badge_${p.id}">${p.price_unit || '₽/кг'}</span>
                        </div>
                        <div class="row">
                            <span style="font-size: 13px; color: var(--hint-color);">Цена:</span>
                            <div class="price-wrapper">
                                <input type="number" id="price_${p.id}" value="${p.price}">
                                <button class="btn-save" onclick="updatePrice(${p.id})">Сохранить</button>
                            </div>
                        </div>
                        <div class="toggles-group">
                            <label class="toggle-label">
                                <input type="checkbox" id="avail_${p.id}" ${p.is_available ? 'checked' : ''} onchange="updateStatus(${p.id}, 'is_available')">
                                В наличии
                            </label>
                            <label class="toggle-label">
                                <input type="checkbox" id="active_${p.id}" ${p.is_active ? 'checked' : ''} onchange="updateStatus(${p.id}, 'is_active')">
                                На сайте
                            </label>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error(err);
                document.getElementById('loading').textContent = 'Не удалось загрузить каталог. Проверьте подключение.';
            }
        }

        async function updatePrice(id) {
            const priceInput = document.getElementById(`price_${id}`);
            const price = parseFloat(priceInput.value);
            if (isNaN(price)) {
                alert('Введите корректную цену');
                return;
            }
            await sendUpdate(id, { price });
        }

        async function updateStatus(id, field) {
            const checkbox = document.getElementById(`${field === 'is_available' ? 'avail' : 'active'}_${id}`);
            const payload = {};
            payload[field] = checkbox.checked;
            await sendUpdate(id, payload);
        }

        async function sendUpdate(id, data) {
            const card = document.getElementById(`card_${id}`);
            card.classList.add('saving');

            try {
                const res = await fetch(FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, ...data })
                });
                const result = await res.json();
                
                if (result.success) {
                    // Тактильный отклик в Telegram (вибрация при успешном сохранении)
                    if (tg && tg.HapticFeedback) {
                        tg.HapticFeedback.notificationOccurred('success');
                    }
                } else {
                    alert('Ошибка при сохранении в базу');
                }
            } catch (err) {
                console.error(err);
                alert('Ошибка соединения с сервером');
            } finally {
                card.classList.remove('saving');
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        loadProducts();
    </script>
</body>
</html>
